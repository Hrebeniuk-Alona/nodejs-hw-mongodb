type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - contactType
  - userId
properties:
  _id:
    description: 'Unique identifier of contact'
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Student's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Phone number of contact'
    type: string
    example: '+380678902367'
  email:
    description: 'Email of contact'
    type: string
    example: 'john_cena@example.com'
  isFavorite:
    description: 'Is contact favourite or not?'
    type: boolean
    example: false
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    example: home
  userId:
    description: 'ID of person who owns this contact'
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: 'Link to contactss photo'
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  createdAt:
    type: string
    format: date-time
    example: 2025-10-22T00:51:19.179+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2025-10-22T00:51:19.179+00:00
